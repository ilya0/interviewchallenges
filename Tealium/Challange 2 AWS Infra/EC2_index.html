<!DOCTYPE html>
<html>
<head>
    <title>Tealium Candidate Challenge</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .container { max-width: 500px; margin: 0 auto; }
        input { padding: 10px; width: 100%; margin-bottom: 10px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Employee Title Lookup</h2>
        <label for="name">Enter Team Member Name:</label>
        <input type="text" id="name" placeholder="e.g. Al Rivera" required />
        <button onclick="submitData()">Submit</button>
        
        <div id="status"></div>
    </div>

    <script>
        async function submitData() {
            const nameValue = document.getElementById('name').value;
            const statusDiv = document.getElementById('status');
            const apiUrl = "https://ev6fu48ss2.execute-api.us-east-2.amazonaws.com/Production/submit";

            if(!nameValue) {
                statusDiv.innerHTML = "Please enter a name.";
                return;
            }

            statusDiv.innerHTML = "Processing...";

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: nameValue })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.innerHTML = `Success! Title found: ${data.data.title}`;
                    statusDiv.style.color = "green";
                } else {
                    statusDiv.innerHTML = `Error: ${data.message}`;
                    statusDiv.style.color = "red";
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = "Network Error or CORS issue.";
                statusDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
